name: Petclinic + Scheduler Experiment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  experiment:
    runs-on: ubuntu-latest

    services:
      scheduler:
        image: ghcr.io/kseniyanesterenko/testscheduler/scheduler:latest
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/actuator/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Petclinic
        uses: actions/checkout@v4

      # ─────────────────────────────
      # WAIT FOR SCHEDULER
      # ─────────────────────────────
      - name: Wait for scheduler to start
        run: |
          echo "Waiting for scheduler..."
          for i in {1..30}; do
            curl -s http://localhost:8080/actuator/health && echo "OK" && break
            echo "Not ready yet..."
            sleep 3
          done

      # ─────────────────────────────
      # CALL SCHEDULER
      # ─────────────────────────────
      - name: Call scheduler
        run: |
          curl -X POST http://localhost:8080/schedule \
            -H "Content-Type: application/json" \
            -d '{
              "testNames": [
                "shouldFindOwnerById",
                "shouldInsertOwner",
                "shouldUpdateOwner",
                "shouldDeleteOwner",
                "shouldFindAllOwners"
              ],
              "containerCount": 3,
              "runId": "run-${{ github.run_id }}"
            }' > schedule.json

          cat schedule.json

      # ─────────────────────────────
      # RUN TESTS (SIMPLIFIED EXECUTION)
      # ─────────────────────────────
      - name: Run tests based on schedule
        run: |
          echo "Running tests (simulated container execution)..."

          # потом заменить на parallel containers
          ./mvnw -B test
